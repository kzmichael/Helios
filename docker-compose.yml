services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - rcdata:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s  


  postgresql:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - 5432:5432 
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka-data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - kafkadata:/data
    command: ["sh", "-c", "chown -R 1000:1000 /data"] 

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s  
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka    

  flyway:
    image: flyway/flyway:latest
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgresql:5432/mydatabase
      FLYWAY_USER: myuser
      FLYWAY_PASSWORD: mypassword
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
      FLYWAY_CONNECT_RETRIES: 60
    volumes:
      - ./apps/_db/migrations:/flyway/sql:ro
      - ./apps/_db/seed:/flyway/seed:ro
    depends_on:
      postgresql:
        condition: service_healthy
  webhook-sink:
    image: mendhak/http-https-echo:latest
    container_name: webhook-sink
    ports: 
      - "127.0.0.1:8082:8080"

  fleet-api:
    image: kshitizmichael/fleet-api:dev
    container_name: fleet-api
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgresql:5432/mydatabase
      PORT: "3000"
      PG_POOL_MAX: "10"
      NODE_ENV: development
    volumes:
      - ./apps/fleet-api/.dev-keys:/src/.dev-keys:ro
    depends_on:
      postgresql:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      
  edge-gateway:
    image: kshitizmichael/edge-gateway:dev
    container_name: edge-gateway
    ports:
      - 8080:8080
    environment:
      REDIS_ADDR: redis:6379 
      LISTEN_ADDR: ":8080"
      FLEET_API_URL: http://fleet-api:3000
      OIDC_ISSUER: https://auth.trackline.local/
      JWKS_URL: http://fleet-api:3000/.well-known/jwks.json
      EXPECTED_AUD: trackline-api
    depends_on:
      fleet-api:  
        condition: service_healthy


  web:
    image: kshitizmichael/web:dev
    container_name: web
    ports:
      - 3000:3000
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080/v1
      NEXT_PUBLIC_WS_BASE: ws://localhost:8080/v1
    depends_on:
      edge-gateway:
        condition: service_started
  ingest:
    image: kshitizmichael/ingest:dev
    container_name: ingest
    environment:
      LISTEN_ADDR: ":9090"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI & API
    volumes:
      - mailpit_data:/data
    environment:
      - TZ=America/New_York
      - MP_MAX_MESSAGES=500
    restart: unless-stopped

  notifier:
    image: kshitizmichael/notifier:dev
    container_name: notifier
    environment:
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: alerts@trackline.local
      WEBHOOK_TIMEOUT_SECS: "5"
    depends_on:
      kafka:
        condition: service_healthy  


  device-sim:
    image: kshitizmichael/device-sim:dev
    container_name: device-sim
    environment:
      INGEST_ADDR: ingest:9090
      DEVICE_COUNT: "5"
      START_LAT: "12.9716"
      START_LON: "77.5946"
      PROFILE_MIX:  commuter,long-haul,idle,erratic
    depends_on:
      ingest:
        condition: service_started


volumes:
  pgdata:
  rcdata:
  kafkadata:
  mailpit_data: